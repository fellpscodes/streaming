<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <title>Streaming pessoal</title>
</head>
<body>
<h1>Minha biblioteca</h1>
<div th:each="group : ${series}">
    <h2 th:text="${group.key}">Nome da série</h2>
    <ul>
        <li th:each="video : ${group.value}">
            <a th:href="'/watch/' + ${video.id()} ">
                <span th:text="${video.displayName()}">nome</span>
                <span class="size" th:text="${video.humanSize()}">tamanho</span>
            </a>
        </li>
    </ul>
</div>
</body>
</html>
