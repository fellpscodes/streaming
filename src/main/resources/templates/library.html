<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <title>Streaming pessoal</title>
</head>
<body>
<h1>Minha biblioteca</h1>

<input type="text" id="search" placeholder="Buscar..." class="search-box" autocomplete="off">

<div th:if="${not #lists.isEmpty(continueWatching)}" class="category">
    <h2>Continuar assistindo</h2>
    <div class="card-grid continue-grid">
        <a th:each="video : ${continueWatching}" th:href="'/watch/' + ${video.id}" class="card continue-card">
            <div class="card-poster continue-poster">
                <img th:src="'/api/media/' + ${video.id} + '/thumbnail'" alt="">
                <span class="play-overlay">▶</span>
                <button class="remove-progress-btn" th:attr="data-id=${video.id}" title="Remover de continuar assistindo">×</button>
                <span class="remaining-badge" th:text="${video.remainingTime()}">Xm restantes</span>
            </div>
            <span class="card-caption" th:if="${@mediaCatalogService.isSeries(video)}" th:text="${@mediaCatalogService.seriesNameOf(video)}">série</span>
            <span class="card-title" th:text="${video.displayName}">nome</span>
        </a>
    </div>
</div>

<div th:if="${not #maps.isEmpty(movies)}" class="category">
    <h2>Filmes</h2>
    <div class="card-grid">
        <div th:each="group : ${movies}" class="card-wrapper media-item" th:attr="data-name=${group.value[0].displayName}">
            <a th:if="${group.value[0].available}" th:href="'/watch/' + ${group.value[0].id}" class="card">
                <div class="card-poster">
                    <img th:src="${group.value[0].posterUrl != null ? group.value[0].posterUrl : '/api/media/' + group.value[0].id + '/thumbnail'}"
                         th:attr="onerror=|this.onerror=null;this.src='/api/media/${group.value[0].id}/thumbnail';|" alt="">
                </div>
                <span class="card-title" th:text="${group.value[0].displayName}">nome</span>
            </a>
            <div th:unless="${group.value[0].available}" class="card card-unavailable">
                <div class="card-poster">
                    <img th:src="${group.value[0].posterUrl != null ? group.value[0].posterUrl : '/api/media/' + group.value[0].id + '/thumbnail'}"
                         th:attr="onerror=|this.onerror=null;this.src='/api/media/${group.value[0].id}/thumbnail';|" alt="">
                </div>
                <span class="card-title" th:text="${group.value[0].displayName}">nome</span>
                <span class="card-subtitle">indisponível</span>
            </div>
            <button class="remove-series-btn" th:attr="data-series=${group.key}">Remover</button>
        </div>
    </div>
</div>

<div th:if="${not #maps.isEmpty(animes)}" class="category">
    <h2>Animes</h2>
    <div class="card-grid">
        <div th:each="group : ${animes}" class="card-wrapper media-item" th:attr="data-name=${group.key}">
            <a th:href="'/series/' + ${group.key}" class="card">
                <div class="card-poster">
                    <img th:src="${group.value[0].posterUrl != null ? group.value[0].posterUrl : '/api/media/' + group.value[0].id + '/thumbnail'}"
                         th:attr="onerror=|this.onerror=null;this.src='/api/media/${group.value[0].id}/thumbnail';|" alt="">
                </div>
                <span class="card-title" th:text="${group.key}">nome</span>
                <span class="card-subtitle" th:text="${#lists.size(group.value)} + ' episódios'">N episódios</span>
            </a>
            <button class="remove-series-btn" th:attr="data-series=${group.key}">Remover</button>
        </div>
    </div>
</div>

<footer class="page-footer">
    <button id="sync-btn">Sincronizar biblioteca</button>
</footer>

<div id="confirm-overlay" class="modal-overlay" hidden>
    <div class="modal-box">
        <p id="confirm-message"></p>
        <div class="modal-actions">
            <button id="confirm-cancel">Cancelar</button>
            <button id="confirm-remove">Remover</button>
        </div>
    </div>
</div>

<script th:inline="none">
    const searchInput = document.getElementById('search');

    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase();

        document.querySelectorAll('.category').forEach(category => {
            if (category.querySelector('.media-item') === null) {
                return;
            }

            let anyVisible = false;

            category.querySelectorAll('.media-item').forEach(item => {
                const matches = item.dataset.name.toLowerCase().includes(query);
                item.style.display = matches ? '' : 'none';
                if (matches) {
                    anyVisible = true;
                }
            });

            category.style.display = anyVisible ? '' : 'none';
        });
    });

    const confirmOverlay = document.getElementById('confirm-overlay');
    const confirmMessage = document.getElementById('confirm-message');
    const confirmCancelBtn = document.getElementById('confirm-cancel');
    const confirmRemoveBtn = document.getElementById('confirm-remove');
    let seriesToRemove = null;

    document.querySelectorAll('.remove-series-btn').forEach(button => {
        button.addEventListener('click', () => {
            seriesToRemove = button.dataset.series;
            confirmMessage.textContent = 'Remover "' + seriesToRemove + '" do banco de dados? O arquivo no disco não é apagado.';
            confirmOverlay.hidden = false;
        });
    });

    confirmCancelBtn.addEventListener('click', () => {
        confirmOverlay.hidden = true;
        seriesToRemove = null;
    });

    confirmOverlay.addEventListener('click', (event) => {
        if (event.target === confirmOverlay) {
            confirmOverlay.hidden = true;
            seriesToRemove = null;
        }
    });

    confirmRemoveBtn.addEventListener('click', () => {
        if (seriesToRemove === null) {
            return;
        }

        fetch('/api/series/' + encodeURIComponent(seriesToRemove), { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    location.reload();
                }
            });
    });

    document.querySelectorAll('.remove-progress-btn').forEach(button => {
        button.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();

            const mediaId = button.dataset.id;

            fetch('/api/media/' + mediaId + '/progress', { method: 'DELETE' })
                .then(response => {
                    if (response.ok) {
                        button.closest('.continue-card').remove();
                    }
                });
        });
    });

    document.getElementById('sync-btn').addEventListener('click', () => {
        const syncBtn = document.getElementById('sync-btn');
        syncBtn.textContent = 'Sincronizando...';

        fetch('/api/library/sync', { method: 'POST' })
            .then(() => location.reload());
    });
</script>
</body>
</html>
