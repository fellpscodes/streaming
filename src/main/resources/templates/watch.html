<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <title>Streaming pessoal</title>
</head>
<body>
<div class="title-row">
    <h1 id="title" th:text="${video.displayName}">Series</h1>
    <button id="edit-title-btn">Editar título</button>
</div>
<video id="player" controls width="800"
       th:src="'/api/media/' + ${video.id} + '/stream'"
       th:data-id="${video.id}"
       th:data-resume="${video.lastPositionSeconds}">
    <track kind="subtitles" th:src="'/api/media/' + ${video.id} + '/subtitles'" srclang="pt" label="Português" default>
</video>

<div th:if="${isSeries}" class="episode-nav">
    <a th:if="${nextEpisode}" th:href="'/watch/' + ${nextEpisode.id}" class="next-episode-card">
        <span class="label">Próximo episódio</span>
        <span th:text="${nextEpisode.displayName}">Nome do episódio</span>
    </a>
    <a th:href="'/series/' + ${seriesName}">Ver episódios</a>
</div>

<a href="/">Voltar</a>

<script th:inline="none">
    const player = document.getElementById('player');
    const mediaId = player.dataset.id;
    const resumeAt = parseFloat(player.dataset.resume);

    player.addEventListener('loadedmetadata', () => {
        if (resumeAt > 0 && resumeAt < player.duration * 0.95) {
            player.currentTime = resumeAt;
        }
    });

    function progressBody() {
        return JSON.stringify({
            positionSeconds: player.currentTime,
            durationSeconds: player.duration
        });
    }

    function sendProgress() {
        if (!player.duration) {
            return;
        }
        fetch('/api/media/' + mediaId + '/progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: progressBody()
        });
    }

    function sendProgressOnUnload() {
        if (!player.duration) {
            return;
        }
        const blob = new Blob([progressBody()], { type: 'application/json' });
        navigator.sendBeacon('/api/media/' + mediaId + '/progress', blob);
    }

    setInterval(sendProgress, 10000);
    player.addEventListener('pause', sendProgress);
    window.addEventListener('beforeunload', sendProgressOnUnload);

    document.getElementById('edit-title-btn').addEventListener('click', () => {
        const titleEl = document.getElementById('title');
        const newTitle = prompt('Novo título:', titleEl.textContent);

        if (newTitle === null || newTitle.trim() === '') {
            return;
        }

        fetch('/api/media/' + mediaId + '/title', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ displayName: newTitle.trim() })
        }).then(response => {
            if (response.ok) {
                titleEl.textContent = newTitle.trim();
            }
        });
    });
</script>
</body>
</html>
