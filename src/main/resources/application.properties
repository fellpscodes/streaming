# =========================================================
# Configuracao da aplicacao
# =========================================================

# Porta em que o servidor local vai rodar.
# Depois de rodar a aplicacao, acesse http://localhost:8080
server.port=8080

# Nome da aplicacao (aparece nos logs de inicializacao)
spring.application.name=streaming

# =========================================================
# Biblioteca de midia local
# =========================================================
# Caminho, no seu computador, da pasta onde estao os seus arquivos
# de video (filmes, series, etc). Troque para o caminho real antes
# de comecar a usar. Use barras normais "/" mesmo no Windows.
streaming.media.library-path=C:/Users/felip/Downloads/Series

# Extensoes de arquivo que a aplicacao vai reconhecer como midia
streaming.media.allowed-extensions=mp4,mkv,avi,mov
