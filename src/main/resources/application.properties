# Carrega application-local.properties se existir (contem a chave da API do TMDB, nao vai para o Git)
spring.config.import=optional:classpath:application-local.properties

# Porta em que o servidor local vai rodar.
server.port=8080

# Nome da aplicacao
spring.application.name=streaming

# Biblioteca de midia local
streaming.media.library-path=C:/Users/felip/Downloads/Streaming-MP4

# Pasta opcional com os arquivos originais (mkv com legendas ASS estilizadas) - usada so para extrair legendas melhores
streaming.media.originals-path=C:/Users/felip/Downloads/Series

# Extensoes de arquivo que a aplicacao vai reconhecer como midia
streaming.media.allowed-extensions=mp4,mkv,avi,mov

#Banco H2
spring.datasource.url=jdbc:h2:file:./data/streaming
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=sa
spring.datasource.password=

# Chave da API do TMDB (busca de capa de filmes) - definida em application-local.properties

# FFmpeg/FFprobe (geracao automatica de miniatura)
thumbnail.ffmpeg-path=ffmpeg
thumbnail.ffprobe-path=ffprobe
thumbnail.storage-path=./data/thumbnails

# Legendas extraidas dos arquivos originais
subtitle.storage-path=./data/subtitles

# Video reconvertido em qualidade melhor a partir do original (gerado em segundo plano)
transcode.storage-path=./data/transcoded