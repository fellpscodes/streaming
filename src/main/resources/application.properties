spring.config.import=optional:classpath:application-local.properties

server.port=8080

spring.application.name=streaming

streaming.media.library-path=./media

streaming.media.originals-path=

streaming.media.allowed-extensions=mp4,mkv,avi,mov

spring.datasource.url=jdbc:h2:file:./data/streaming
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=sa
spring.datasource.password=

thumbnail.ffmpeg-path=ffmpeg
thumbnail.ffprobe-path=ffprobe
thumbnail.storage-path=./data/thumbnails

subtitle.storage-path=./data/subtitles

transcode.storage-path=./data/transcoded

poster.storage-path=./data/posters
